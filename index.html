function calc(lignes, type, S = cfg()) {
  const by = {}; let ht = 0;
  (lignes || []).forEach(l => {
    const t = r3(l.qte * l.pu * (1 - (+l.rem || 0) / 100)); ht += t;
    const k = String(+l.tva); by[k] = by[k] || {rate: +l.tva, base: 0, tva: 0}; by[k].base = r3(by[k].base + t);
  });
  const g = Object.values(by).sort((a, b) => b.rate - a.rate); g.forEach(b => { b.tva = r3(b.base * b.rate / 100); });
  ht = r3(ht); const tva = r3(g.reduce((s, b) => s + b.tva, 0)), ttc = r3(ht + tva);
  const timbre = (type === 'FC' ? S.timbreFC : type === 'FT' ? S.timbreFT : false) ? r3(+S.timbre) : 0;
  return {ht, tva, ttc, timbre, net: r3(ttc + timbre), by: g};
}

async function applyStock(lignes, numero, sign = -1) {
  const out = [];

    const st = +s.data().stock || 0, q = +l.qte || 0;

  const html = '<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>' + esc(d.numero) + '</title><style>@page{size:A4;margin:0}body{margin:0;background:#fff}.a4{width:794px;margin:0 auto}' + PAPER_CSS + '</style></head><body><div class="a4">' + docPrint(d) + '</div></body></html>';
  try { await ctx.dl.save({filename: String(d.numero).replace(/[^A-Za-z0-9_-]/g, '-') + '.html', data: html}); } catch (e) { if (!e || e.code !== 'declined') toast('Téléchargement impossible.', true); }
}

function cartDoc(extra = {}) { const S = cfg(); return {type: 'TC', numero: 'APERÇU', date: ds(), client: {nom: CART.client}, lignes: CART.lignes, totals: calc(CART.lignes, 'TC', S), ...extra}; }
function clearCart() { CART = {lignes: [], client: ''}; saveLocal(); }
async function cash(asFC) {
  if (!CART.lignes.length || BUSY) return;
  const L = CART.lignes.map(l => ({...l})), client = {nom: CART.client}, due = asFC ? calc(L, 'FC').net : calc(L, 'TC').ttc, pv = String(CART.paye || '').trim() === '' ? due : Math.min(due, Math.max(0, parseFloat(String(CART.paye).replace(',', '.')) || 0)), mode = CART.mode || 'Espèces';
  let p2 = Math.min(due, Math.max(0, parseFloat(String(CART.paye2 || '').replace(',', '.')) || 0)), mode2 = CART.mode2 || 'Espèces', pv1 = p2 > 0 ? (String(CART.paye || '').trim() === '' ? r3(Math.max(0, due - p2)) : Math.min(pv, r3(Math.max(0, due - p2)))) : pv;
  if (OFF) {
    const prov = enqueue('vente', {client, lignes: L, paye: pv, mode}); const d = cartDoc({numero: prov, isProv: true}); clearCart(); render(); showDoc(d); return;
  }
  /* crédit choisi pour tout le montant mais insuffisant (ex. facture FC = ticket + timbre) : crédit plafonné, le reste en espèces */
  if (mode === CREDIT && !(p2 > 0) && (client.nom || '').trim() && pv1 > creditSolde(client.nom) + 0.0005 && creditSolde(client.nom) > 0.0005) { const so = creditSolde(client.nom); p2 = r3(pv1 - so); pv1 = so; mode2 = mode2 === CREDIT ? 'Espèces' : mode2; toast('Crédit utilisé : ' + fmt(so) + ' ; reste ' + fmt(p2) + ' en ' + mode2); }
  const crUse = r3((mode === CREDIT ? pv1 : 0) + (mode2 === CREDIT ? p2 : 0));
  if (crUse > 0) { if (!(client.nom || '').trim()) return toast('Indiquez le client pour utiliser son crédit.', true); const so = creditSolde(client.nom); if (crUse > so + 0.0005) return toast('Crédit disponible de ' + client.nom + ' : ' + fmt(so) + '. Encaissez la différence avec un autre mode.', true); }
  const short = L.filter(l => { const a = l.aid && D.articles.find(x => x.id === l.aid); return false; }).map(l => l.desig);
  BUSY = true; render();
  try {
    const r = asFC ? await createFacture('FC', client, L, {source: 'comptoir', suivi: true, opId: uid() + uid()}) : await createTicket(client, L, {source: 'comptoir', suivi: true, opId: uid() + uid(), ...(CART.reg ? {regId: CART.reg} : {})});
    try { if (pv1 > 0) await addPay(asFC ? 'fact' : 'tic', {id: r.id, numero: r.numero, client}, pv1, mode, ds()); if (p2 > 0) await addPay(asFC ? 'fact' : 'tic', {id: r.id, numero: r.numero, client}, p2, mode2, ds()); } catch (e) { toast('Pièce créée, mais le paiement n\'a pas été enregistré : ajoutez-le dans Recouvrement.', true); }
    clearCart(); BUSY = false; render(); showDoc({...r.doc, id: r.id}); toast((asFC ? 'Facture ' : 'Ticket ') + r.numero + ' créé' + (short.length ? ' ⚠ stock insuffisant pour : ' + short.join(', ') + ' (conflit signalé, à régulariser)' : ''), !!short.length);
  } catch (e) { BUSY = false; render(); toast(e.message || 'Enregistrement impossible', true); }
}

function handleLogo(f) {
  if (!f) return;
  if (!/^image\/(png|jpeg)$/.test(f.type)) return toast('Format accepté : PNG ou JPG.', true);
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 800 / img.width, 400 / img.height), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const x = c.getContext('2d'); if (f.type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); } x.drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', .85);
      if (out.length > 150 * 1024 * 1.37) out = c.toDataURL('image/jpeg', .8); if (out.length > 150 * 1024 * 1.37) out = c.toDataURL('image/jpeg', .65);
      if (out.length > 150 * 1024 * 1.37) return toast('Logo trop lourd (max 150 Ko). Choisissez une image plus simple.', true);
      PL = out; render();
    };
    img.onerror = () => toast('Image illisible.', true); img.src = rd.result;
  };
  rd.readAsDataURL(f);
}

  L.sort((a, b) => (a.date + (a.heure || '')).localeCompare(b.date + (b.heure || '')));

    return `<tr class="fi"><td>${fdate(x.date)}<div class="text-xs text-mute">${esc(x.heure || '')}${x.duree ? ' · ' + x.duree + ' h' : ''}</div>${late ? bd('Date dépassée', 'b-bad') : ''}</td><td class="font-semibold">${esc(x.titre)}<div class="text-xs text-mute">${esc(x.type)}</div>${dosTag(x.dossier)}</td><td>${esc(x.client || '')}<div class="text-xs text-mute">${esc(x.lieu || '')}</div></td><td>${esc(ivTech(x) || '—')}</td><td><button type="button" class="bd cy ${ISB[x.statut]}" data-a="intcycle" data-id="${x.id}" title="Cliquer pour changer le statut">${esc(x.statut)}</button></td><td><div class="acts"><button type="button" class="ib" data-a="intedit" data-id="${x.id}" aria-label="Modifier">${ic('edit')}</button></div></td></tr>`; }).join('') || emptyRow(6, 'Aucune intervention. Créez-en une pour alimenter le planning.');

    `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpi('Planifiées', n('Planifiée'), 'à venir', 'cal', 't-info')}${kpi('En cours', n('En cours'), 'sur le terrain', 'wrench', n('En cours') ? 't-warn' : 't-ok')}${kpi('Reportées', n('Reportée'), 'à replanifier', 'clip', n('Reportée') ? 't-warn' : 't-ok')}${kpi('Terminées', n('Terminée'), 'au total', 'check', 't-ok')}</div>` +

}

/* ---------- Planning (semaine) ---------- */
const JOURS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
function weekStart(off) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const wkOf = d => { const x = new Date(d + 'T00:00:00'); return addD(d, -((x.getDay() + 6) % 7)); };
function vPlanning() {
  const v = FILT.plv || 'semaine', a = FILT.pld || ds(), q = normS(FILT.tech || ''), today = ds();
  const ofDay = (d, all) => D.interventions.filter(x => x.date === d && (all || x.statut !== 'Annulée') && (!q || normS(ivTech(x)).includes(q))).sort((p, r) => (p.heure || '').localeCompare(r.heure || ''));
  const card = x => `<button type="button" class="cat-item" style="width:100%;text-align:left;display:block" data-a="intedit" data-id="${x.id}"><span class="block text-xs text-mute">${esc(x.heure || '')}${x.duree ? ' · ' + x.duree + ' h' : ''} ${bd(x.statut, ISB[x.statut])}</span><span class="block font-semibold">${esc(x.titre)}</span><span class="block text-xs text-mute">${esc(ivTech(x) || 'Non affecté')}${x.lieu ? ' · ' + esc(x.lieu) : ''}</span>${x.dossier ? `<span class="block text-xs text-mute">${esc(x.dossier)}</span>` : ''}</button>`;
  let body = '', sub = '';
  if (v === 'jour') {
    const L = ofDay(a, true); sub = JOURS[(new Date(a + 'T00:00:00').getDay() + 6) % 7] + ' ' + fdate(a);
    body = `<div class="flex justify-end" style="margin-bottom:.5rem">${btn('intnew', 'Ajouter ce jour', 'btn-o', 'data-date="' + a + '"', 'plus')}</div>` + (L.map(x => { const f = x.fiche || {}, an = x.statut === 'Annulée';
      return `<section class="card p-4" style="margin-bottom:.75rem;${an ? 'opacity:.55' : ''}"><div class="flex flex-wrap justify-between gap-2"><div><div class="text-xs text-mute">${esc(x.heure || '')}${x.duree ? ' · ' + x.duree + ' h' : ''} · ${esc(x.type || '')}</div><div class="font-bold">${esc(x.titre)}</div></div><div>${bd(x.statut, ISB[x.statut])}</div></div>
        <div class="text-sm" style="margin-top:.4rem;display:grid;gap:.15rem">${x.client ? `<div><b>Client :</b> ${esc(x.client)}</div>` : ''}${x.lieu ? `<div><b>Lieu :</b> ${esc(x.lieu)}</div>` : ''}<div><b>Équipe :</b> ${esc(ivTech(x) || 'Non affecté')}</div>${x.dossier ? `<div><b>Dossier :</b> ${esc(x.dossier)}</div>` : ''}${x.note ? `<div><b>Consignes :</b> ${esc(x.note)}</div>` : ''}</div>
        ${f.travaux || f.observations ? `<div class="text-sm" style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--line)"><b>Compte rendu</b>${f.arrivee ? ' (' + esc(f.arrivee) + (f.depart ? ' → ' + esc(f.depart) : '') + ')' : ''}${f.travaux ? `<div>${esc(f.travaux)}</div>` : ''}${f.materiel ? `<div class="text-mute">Matériel : ${esc(f.materiel)}</div>` : ''}${f.observations ? `<div class="text-mute">${esc(f.observations)}</div>` : ''}</div>` : ''}
        <div class="flex justify-end" style="margin-top:.5rem">${smb('intedit', 'Ouvrir', 'btn-o', 'data-id="' + x.id + '"', 'edit')}</div></section>`; }).join('') || '<div class="card p-4 text-center text-mute">Aucune intervention ce jour.</div>');
  } else if (v === 'mois') {
    const m = a.slice(0, 7), first = m + '-01', last = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate(), s0 = wkOf(first), end = m + '-' + pad(last), cells = [];

      return `<button type="button" class="card" style="min-height:84px;padding:4px 6px;text-align:left;cursor:pointer;${om ? 'opacity:.45;' : ''}${d === today ? 'outline:2px solid var(--accent,#2563eb);' : ''}" data-a="pljour" data-d="${d}"><div class="font-semibold text-sm">${+d.slice(8)}</div>${L.slice(0, 3).map(x => `<div class="text-xs truncate">${esc((x.heure || '') + ' ' + x.titre)}</div>`).join('')}${L.length > 3 ? `<div class="text-xs text-mute">+${L.length - 3} autre(s)</div>` : ''}</button>`; }).join('')}</div></div>`;
  } else {
    const w0 = wkOf(a), days = [...Array(7)].map((_, i) => addD(w0, i)); sub = 'Semaine du ' + fdate(w0) + ' au ' + fdate(days[6]);
    body = `<div class="grid gap-3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${days.map((d, i) => `<div class="card" style="min-width:0;${d === today ? 'outline:2px solid var(--accent,#2563eb)' : ''}"><div class="bh" style="padding:.5rem .75rem"><button type="button" style="background:none;border:0;padding:0;cursor:pointer;text-align:left" data-a="pljour" data-d="${d}"><h2 style="font-size:.8rem">${JOURS[i]} ${d.slice(8)}/${d.slice(5, 7)}${d.slice(0, 4) !== today.slice(0, 4) ? '/' + d.slice(0, 4) : ''}</h2></button><button type="button" class="ib" data-a="intnew" data-date="${d}" aria-label="Ajouter ce jour">${ic('plus')}</button></div><div class="p-2 grid gap-2">${ofDay(d, false).map(card).join('') || '<div class="hint" style="padding:.3rem">Libre</div>'}</div></div>`).join('')}</div>`;
  }
  const unassigned = D.interventions.filter(x => !ivTech(x) && ['Planifiée', 'Reportée'].includes(x.statut)).length;
  const vb = `<div class="flex gap-1" role="group" aria-label="Vue">${[['jour', 'Jour'], ['semaine', 'Semaine'], ['mois', 'Mois']].map(([k, l]) => `<button type="button" class="btn btn-sm ${k === v ? 'btn-p' : 'btn-o'}" data-a="filt" data-f="plv" data-v="${k}">${l}</button>`).join('')}</div>`;
  const nav = `<div class="flex flex-wrap items-center gap-2" style="margin-bottom:.75rem">${vb}<button type="button" class="btn btn-o btn-sm" data-a="semgo" data-d="-1" aria-label="Précédent">←</button><button type="button" class="btn btn-o btn-sm" data-a="semgo" data-d="0">Aujourd'hui</button><button type="button" class="btn btn-o btn-sm" data-a="semgo" data-d="1" aria-label="Suivant">→</button><label class="text-sm" for="pl-date">Aller au</label><input id="pl-date" type="date" class="in" style="width:auto" data-a="filt" data-f="pld" value="${a}"><input id="pl-tech" class="in" type="search" style="width:12rem;max-width:100%" placeholder="Filtrer par technicien…" aria-label="Filtrer par technicien" value="${esc(FILT.tech || '')}"></div>`;
  return head('Planning', sub + (unassigned ? ' · ' + unassigned + ' intervention(s) sans technicien' : ''), btn('intnew', 'Nouvelle intervention')) + nav + body;
}

/* ---------- Tâches ---------- */
const TST = ['À faire', 'En cours', 'Fait'], TSB = {'À faire': 'b-warn', 'En cours': 'b-info', 'Fait': 'b-ok'}, PRI = {'Haute': 'b-bad', 'Normale': 'b-info', 'Basse': 'b-mute'};
PF.tache = {n: 'Nouvelle tâche', e: 'Modifier la tâche', f: [{k: 'titre', l: 'Tâche', req: 1, w: 1}, {k: 'echeance', l: 'Échéance', t: 'date', d: () => ds(2)}, {k: 'priorite', l: 'Priorité', t: 'select', o: ['Haute', 'Normale', 'Basse'], d: 'Normale'}, {k: 'assigne', l: 'Responsable'}, {k: 'statut', l: 'Statut', t: 'select', o: TST, d: 'À faire'}, DOSF],
  save: (v, id) => setOrUpd('taches', id, v)};

    `<div class="grid grid-cols-2 lg:grid-cols-3 gap-3">${kpi('À faire', D.taches.filter(t => t.statut === 'À faire').length, 'pas encore commencées', 'check', 't-info')}${kpi('En retard', late, 'échéance dépassée', 'clip', late ? 't-warn' : 't-ok')}${kpi('Terminées', D.taches.filter(t => t.statut === 'Fait').length, 'au total', 'check', 't-ok')}</div>` +

}

/* ---------- Recouvrement ---------- */
function paidOf(x, kind = 'fact') { return r3(D.paiements.filter(p => !p.annule && ((p.docId === x.id && p.kind === kind) || (kind === 'fact' && p.factureId === x.id))).reduce((s, p) => s + p.montant, 0) + (x.recuId ? ((byId(D.recus, x.recuId) || {}).montant || 0) : 0) + (kind === 'fact' ? tkPaidForInv(x) + (+x.avoirTotal || 0) : (+x.avoirTotal || 0))); }
async function addPay(kind, x, montant, mode, date, note, extra) { if (!(montant > 0)) return; if (mode === CREDIT) { const cl = ((x.client || {}).nom || '').trim(); if (!cl) throw new Error('Client inconnu : le crédit client ne peut pas être utilisé.'); if (montant > creditSolde(cl) + 0.0005) throw new Error('Crédit disponible insuffisant (' + fmt(creditSolde(cl)) + ').'); await creditMove(cl, -montant, 'Paiement ' + (x.numero || ''), x.numero); } const p = {...(extra || {}), kind, docId: x.id, ...(kind === 'fact' ? {factureId: x.id} : {}), numero: x.numero, dossier: x.dossier || '', montant: r3(montant), date: date || ds(), mode: mode || 'Espèces', note: note || '', ...stamp()}; D.paiements.push({id: 'tmp' + uid(), ...p}); await ctx.db.doc('paiements/' + uid()).set(p); }
const payBadge = (x, kind) => { if (kind === 'tic' ? !x.suivi || x.statut === 'Annulé' : x.statut === 'Annulée' || (x.type === 'FC' && ['comptoir', 'globale'].includes(x.source) && !x.suivi)) return ''; const du = kind === 'tic' ? x.totals.ttc : (x.totals.net != null ? x.totals.net : x.totals.ttc), pay = paidOf(x, kind), re = r3(du - pay); return re <= 0.0005 ? bd('Payé', 'b-ok') : pay > 0 ? bd('Reste ' + fmt(re), 'b-warn') : bd('Impayé', 'b-info'); };
function recouvList() {
  const S = cfg(), today = ds();
  const mk = (f, kind) => { const du = kind === 'tic' ? f.totals.ttc : (f.totals.net != null ? f.totals.net : f.totals.ttc), pay = paidOf(f, kind), reste = r3(du - pay), ech = echOf(f, pay) || f.echeance || addD(f.date, +S.delaiPaiement || 0); return {f, kind, du, pay, reste, ech, retard: reste > 0.0005 ? Math.max(0, dd(today, ech)) : 0}; };
  return [...D.factures.filter(f => f.statut !== 'Annulée' && (!(f.type === 'FC' && ['comptoir', 'globale'].includes(f.source)) || (f.suivi && f.source === 'comptoir'))).map(f => mk(f, 'fact')), ...D.tickets.filter(t => t.suivi && t.statut !== 'Annulé' && !t.regFacture).map(t => mk(t, 'tic'))];
}
PF.paiement = {n: 'Enregistrer un paiement', ok: 'Enregistrer', f: [{k: 'montant', l: 'Montant reçu (DT)', t: 'number', req: 1, d: x => x ? x.reste : 0}, {k: 'date', l: 'Date', t: 'date', d: () => ds()}, {k: 'mode', l: 'Mode', t: 'select', o: ['Espèces', 'Chèque', 'Virement', 'Traite', 'Carte', 'Crédit client'], d: 'Espèces'}, {k: 'piece', l: 'N° chèque / traite'}, {k: 'banque', l: 'Banque'}, {k: 'echeanceP', l: 'Échéance (traite, chèque post-daté)', t: 'date', d: () => ds()}, {k: 'montant2', l: '2e mode : montant (facultatif)', t: 'number', d: 0}, {k: 'mode2', l: '2e mode', t: 'select', o: ['Espèces', 'Chèque', 'Virement', 'Traite', 'Carte', 'Crédit client'], d: 'Espèces'}, {...CPTF, l: 'Compte bancaire (virement ou carte)'}, {k: 'note', l: 'Note', w: 1}],
  save: async (v, id, x) => { if (!(v.montant > 0)) { toast('Indiquez le montant.', true); return false; } const f = byId(x.kind === 'tic' ? D.tickets : D.factures, x.id); const m2 = Math.max(0, +v.montant2 || 0); if (v.montant + m2 > (x.reste || Infinity) + 0.0005) { toast('Le total dépasse le reste à payer (' + fmt(x.reste) + ').', true); return false; }
    const cr = (v.mode === 'Crédit client' ? v.montant : 0) + (v.mode2 === 'Crédit client' ? m2 : 0), cl = ((f.client || {}).nom || ''); if (cr > 0 && cr > creditSolde(cl) + 0.0005) { toast('Crédit disponible insuffisant : ' + fmt(creditSolde(cl)), true); return false; }
    try { const ex = md => ['Chèque', 'Traite'].includes(md) ? {piece: v.piece, banque: v.banque, echeance: v.echeanceP || v.date} : BANKMODES.includes(md) ? {compte: v.compte} : {}; await addPay(x.kind, f, v.montant, v.mode, v.date, v.note, ex(v.mode)); if (m2 > 0) await addPay(x.kind, f, m2, v.mode2, v.date, v.note, ex(v.mode2)); } catch (e) { toast(e.message, true); return false; } toast('Paiement enregistré'); } };
PF.echeance = {n: 'Date d\'échéance', f: [{k: 'echeance', l: 'Échéance de paiement', t: 'date', req: 1, d: x => x ? x.ech : ds()}], save: async (v, id, x) => { await ctx.db.doc((x.kind === 'tic' ? 'tickets/' : 'factures/') + x.id).update({echeance: v.echeance}); } };
function vRecouv() {
  const f = FILT.rec || 'impayes', all = recouvList(), open = all.filter(x => x.reste > 0.0005), late = open.filter(x => x.retard > 0);
  let L = all; if (f === 'impayes') L = open; else if (f === 'retard') L = late; else if (f === 'payees') L = all.filter(x => x.reste <= 0.0005);
  L = [...L].sort((a, b) => b.retard - a.retard || a.ech.localeCompare(b.ech));
  const sum = a => r3(a.reduce((s, x) => s + x.reste, 0));
  const rows = L.map(({f: x, kind, du, pay, reste, ech, retard}) => `<tr class="fi"><td class="font-semibold">${esc(x.numero)}${kind === 'tic' ? '<div class="text-xs text-mute">Ticket comptoir</div>' : ''}${dosTag(x.dossier)}</td><td>${esc(cname(x))}</td><td class="num">${fmt(du)}</td><td class="num">${fmt(pay)}</td><td class="num font-semibold">${fmt(reste)}</td><td>${fdate(ech)}${retard ? ' ' + bd(retard + ' j de retard', 'b-bad') : ''}${relCell(x)}</td><td>${reste <= 0.0005 ? bd('Payée', 'b-ok') : pay > 0 ? bd('Partielle', 'b-warn') : bd('Impayée', retard ? 'b-bad' : 'b-info')}</td><td><div class="acts">${smb('viewdoc', 'Voir', 'btn-o', 'data-k="' + (kind === 'tic' ? 'tic' : 'fact') + '" data-id="' + x.id + '"', 'eye')}${smb('rechist', 'Historique', 'btn-o', 'data-id="' + x.id + '" data-kind="' + kind + '"')}${reste > 0.0005 ? smb('recpay', 'Paiement', 'btn-ok', 'data-id="' + x.id + '"', 'euro') + smb('recrel', 'Relance', 'btn-o', 'data-id="' + x.id + '" data-kind="' + kind + '"', 'phone') + smb('receche', 'Échéance', 'btn-o', 'data-id="' + x.id + '"') : ''}${kind === 'fact' && reste > 0.0005 ? smb('facmod', 'Modalités', 'btn-o', 'data-id="' + x.id + '"') : ''}</div></td></tr>`).join('') || emptyRow(8, 'Aucune facture dans cette vue.');
  const sel = `<select class="in" style="width:auto" data-a="filt" data-f="rec">${[['impayes', 'À recouvrer'], ['retard', 'En retard'], ['payees', 'Payées'], ['toutes', 'Toutes']].map(([v, l]) => `<option value="${v}"${f === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  return head('Suivi du recouvrement', 'Factures à encaisser, échéances, paiements et relances. Les factures du comptoir (payées sur place) sont exclues.', sel) +
    `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpi('Reste à recouvrer', fmt(sum(open)), open.length + ' facture(s)', 'euro', open.length ? 't-warn' : 't-ok')}${kpi('En retard', fmt(sum(late)), late.length + ' facture(s)', 'clip', late.length ? 't-bad' : 't-ok')}${kpi('Relances ce mois', D.factures.reduce((n, x) => n + (x.relances || []).filter(r => r.date.slice(0, 7) === ds().slice(0, 7)).length, 0), 'enregistrées', 'phone', 't-info')}${kpi('Encaissé ce mois', fmt(r3(D.paiements.filter(p => p.date.slice(0, 7) === ds().slice(0, 7)).reduce((s, p) => s + p.montant, 0))), 'paiements saisis', 'check', 't-ok')}</div>` +
    tbl('<th>Pièce</th><th>Client</th><th class="num">À payer</th><th class="num">Payé</th><th class="num">Reste</th><th>Échéance</th><th>Statut</th><th></th>', rows, 1100) +
    `<div class="hint">Une facture issue d'un reçu est considérée comme déjà payée à hauteur du montant du reçu. Échéance par défaut : date de facture + ${cfg().delaiPaiement} jours (réglable dans Paramétrage).</div>`;
}

/* ---------- Encaissement partiel au comptoir : reste à payer en direct ---------- */
function cartReste() {
  const t = calc(CART.lignes, 'TC'), el = $('#cart-reste'); if (!el) return;
  const raw = String(CART.paye || '').trim(), p2 = Math.min(t.ttc, Math.max(0, parseFloat(String(CART.paye2 || '').replace(',', '.')) || 0)), pv1 = raw === '' ? r3(Math.max(0, t.ttc - p2)) : Math.min(t.ttc, Math.max(0, parseFloat(raw.replace(',', '.')) || 0)), pv = Math.min(t.ttc, r3(pv1 + p2)), re = r3(t.ttc - pv);
  el.textContent = re > 0.0005 ? 'Reste à payer (ticket) : ' + fmt(re) : '';
  el.style.color = re > 0.0005 ? 'var(--bad-fg,#b91c1c)' : '';
  /* Monnaie à rendre : montant reçu en espèces − part payée en espèces maintenant */
  const ro = $('#cart-rendu'); if (!ro) return; const rr = String(CART.recu || '').trim(), recu = parseFloat(rr.replace(',', '.')) || 0;
  const esp = r3(((CART.mode || 'Espèces') === 'Espèces' ? pv1 : 0) + ((CART.mode2 || 'Espèces') === 'Espèces' && p2 > 0 ? p2 : 0));
  if (rr === '' || !(t.ttc > 0)) { ro.innerHTML = ''; return; }
  if (!(esp > 0)) { ro.innerHTML = '<small>Aucun paiement en espèces choisi (mode : ' + esc(CART.mode || '') + ').</small>'; ro.style.color = ''; return; }
  const d = r3(recu - esp);
  if (d >= -0.0005) { ro.innerHTML = '<small>Monnaie à rendre</small>' + fmt(Math.max(0, d)); ro.style.color = 'var(--ok-fg,#15803d)'; }
  else { ro.innerHTML = '<small>Il manque</small>' + fmt(-d) + '<small>Si le client paie seulement une partie, saisissez-la dans « Encaissé maintenant » : le reste sera suivi.</small>'; ro.style.color = 'var(--bad-fg,#b91c1c)'; }
}
document.addEventListener('input', e => { if (e.target.id === 'cart-recu') { CART.recu = e.target.value; saveLocal(); cartReste(); } else if (e.target.id === 'cart-paye') { CART.paye = e.target.value; saveLocal(); cartReste(); } else if (e.target.id === 'cart-paye2') { CART.paye2 = e.target.value; saveLocal(); cartReste(); } });
document.addEventListener('change', e => { if (e.target.id === 'cart-mode') { CART.mode = e.target.value; saveLocal(); cartReste(); } else if (e.target.id === 'cart-mode2') { CART.mode2 = e.target.value; saveLocal(); cartReste(); } });

/* Stockage (règles d'accès réelles) : pointages/{uid} (écrit par l'employé), demandes/{uid} (écrit par l'employé),
   rh/{uid} (écrit par l'admin seul, lisible par l'employé) ; rhformations, rhrecrut : admin seul. */
const HSEM = 48 * 60, DPAUSE = 60;
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
const hmTxt = m => { m = Math.max(0, Math.round(m || 0)); return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };

const dAdd = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const monOf = s => { const d = new Date(s + 'T12:00:00Z'), w = (d.getUTCDay() + 6) % 7; return dAdd(s, -w); };
const weekMin = (u, date) => { const m = monOf(date), D_ = ptDays(u); let t = 0; for (let i = 0; i < 7; i++) t += dayMin(u, D_[dAdd(m, i)]); return t; };
const isDim = s => new Date(s + 'T12:00:00Z').getUTCDay() === 0;
const joursOuv = (a, b) => { if (!a || !b || b < a) return 0; let n = 0; for (let d = a; d <= b && n < 400; d = dAdd(d, 1)) if (!isDim(d)) n++; return n; };
const statDem = (u, id) => ((rhOf(u).decisions || {})[id] || {}).s || 'Demandé';
const demList = u => ((D.demandes[u] || {}).items || []).map(x => ({...x, u, statut: statDem(u, x.id), dec: (rhOf(u).decisions || {})[x.id] || {}}));
const allDem = () => empIds().flatMap(demList).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
const empIds = () => { const so = new Set(D.personnel.filter(p => p.statut === 'Sorti').map(p => p.uid || p.id)); return [...new Set([...D.personnel.filter(p => FILT.rhSortis || p.statut !== 'Sorti').map(p => p.uid || p.id), ...Object.keys(D.staff), ...Object.keys(D.pointages).filter(k => FILT.rhSortis || !so.has(k)), ...Object.keys(D.demandes).filter(k => FILT.rhSortis || !so.has(k)), ...(ctx.uid ? [ctx.uid] : [])])]; };

function monthStat(u, ym) {
  const days = ptDays(u), ks = Object.keys(days).filter(k => k.slice(0, 7) === ym).sort();
  const tot = ks.reduce((s, k) => s + dayMin(u, days[k]), 0), weeks = new Set(ks.map(monOf));
  let hs = 0; weeks.forEach(w => { if (w.slice(0, 7) === ym) hs += Math.max(0, weekMin(u, w) - HSEM); });
  return {ks, tot, hs, jours: ks.filter(k => days[k].f).length, incompl: ks.filter(k => days[k].d && !days[k].f && k < ds())};
}
function soldes(u, y = new Date().getFullYear()) {
  const r = rhOf(u), L = demList(u).filter(x => x.statut === 'Approuvé' && (x.debut || '').slice(0, 4) === String(y)), sum = t => L.filter(x => x.type === t).reduce((s, x) => s + (+x.jours || 0), 0);
  const droit = (+r.congesAn || 0) + (+r.report || 0), pris = sum('Annuel'), rec = +r.recompense || 0, recPris = sum('Récompense');
  return {droit, pris, solde: droit - pris, rec, recPris, recSolde: rec - recPris, maladie: sum('Maladie'), autre: sum('Autre')};
}

}

function ptCard() {

}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id, u = b.dataset.u, date = b.dataset.date;
  switch (a) {
    case 'pstart': { if (!needOn()) return; const t = ds(), cur = ptDays(ctx.uid)[t]; if (cur && cur.d) { toast('Déjà commencé à ' + cur.d); return; } wr(async () => { await ptSave(ctx.uid, t, {d: nowHM(), f: ''}); toast('Bon travail ! Début enregistré à ' + nowHM()); }); break; }
    case 'pend': { if (!needOn()) return; const t = ds(), cur = ptDays(ctx.uid)[t]; if (!cur || !cur.d) { toast('Commencez d\'abord la journée.', true); return; } if (cur.f) { toast('Journée déjà terminée.'); return; } wr(async () => { await ptSave(ctx.uid, t, {...cur, f: nowHM()}); toast('Fin enregistrée à ' + nowHM()); }); break; }
    case 'rhdemc': openPF('demconge'); break;
    case 'rhdema': openPF('demavance'); break;
    case 'rhtab': FILT.rhTab = id; FILT.rhEmp = ''; render(); break;
    case 'rhdet': FILT.rhEmp = u; render(); break;
    case 'rhback': FILT.rhEmp = ''; render(); break;
    case 'rhpt': { const days = ptDays(u), x = date ? {date, ...(days[date] || {})} : null; openPF('pointage', x, {u}); break; }
    case 'rhptdel': if (!arm(b, 'Supprimer ?')) return; wr(() => ptSave(u, date, null)); break;
    case 'rhedit': openPF('rhfiche', rhOf(u), {u}); break;
    case 'rhok': { const x = demList(u).find(z => z.id === id); if (!x) return; if (x.type === 'Avance') { const av = avanceInfo(u, (x.date || '').slice(0, 7)); if (+x.montant > av.dispo) { toast('Dépasse le plafond disponible (' + av.dispo.toFixed(3) + ' DT). Modifiez la fiche du salarié si besoin.', true); return; } }
      if (x.type === 'Annuel') { const so = soldes(u); if (x.jours > so.solde) { toast('Solde insuffisant (' + so.solde + ' j). Ajustez la fiche RH du salarié.', true); return; } }
      wr(() => decide(u, id, {s: x.type === 'Avance' ? 'Accordé' : 'Approuvé'})); break; }

    case 'rhfdl': { const ym = FILT.rhMois || ds().slice(0, 7); ctx.dl.save({filename: 'recap-paie-' + ym + '-' + String(nameOf(u)).replace(/[^A-Za-z0-9]+/g, '-') + '.html', data: '<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Récap paie</title></head><body style="padding:24px">' + rhFicheHtml(u, ym) + '</body></html>'}).catch(() => {}); break; }

/* ---------- Fournisseurs ---------- */
const fournByNom = n => D.fournisseurs.find(f => normS(f.nom) === normS(n));
async function ensureFourn(nom, mf, adresse) { if (!nom || !nom.trim()) return null; const ex = fournByNom(nom); if (ex) return ex; const id = uid() + uid(), f = {nom: nom.trim(), mf: mf || '', adresse: adresse || '', delai: 30, ...stamp()}; await ctx.db.doc('fournisseurs/' + id).set(f); return {id, ...f}; }

  save: async (v, id) => { if (!v.nom) { toast('Indiquez le nom.', true); return false; } if (!id && fournByNom(v.nom)) { toast('Ce fournisseur existe déjà.', true); return false; } await setOrUpd('fournisseurs', id, v); toast('Fournisseur enregistré'); }};
const ffOf = f => D.facfourn.filter(x => x.fournId === f.id && x.statut !== 'Annulée');

const ffReste = x => Math.max(0, r3((+x.ttc || 0) - ffPaid(x)));
function vFourn() {

  const adm = ctx.admin;

/* ---------- Mouvements de stock ---------- */

  return head('Mouvements de stock', 'Historique des entrées et sorties : ventes, factures, avoirs, réceptions, livraisons.', `<input class="in" style="width:13rem" placeholder="Article ou pièce…" data-a="filt" data-f="mvq" value="${esc(FILT.mvq || '')}">` + monthSel('mvm')) +

}

/* ---------- Dépenses ---------- */

PF.depense = {n: 'Nouvelle dépense', e: 'Modifier la dépense', f: [{k: 'date', l: 'Date', t: 'date', d: () => ds()}, {k: 'categorie', l: 'Catégorie', t: 'select', o: DCAT, d: 'Autre'}, {k: 'libelle', l: 'Libellé', req: 1, w: 1}, {k: 'montant', l: 'Montant TTC (DT)', t: 'number', req: 1, d: 0}, {k: 'mode', l: 'Payé par', t: 'select', o: MODEP, d: 'Espèces'}, CPTF, ACTF, {k: 'piece', l: 'N° pièce / facture'}, {k: 'beneficiaire', l: 'Bénéficiaire'}, {k: 'fournId', l: 'Tiers enregistré (bailleur, prestataire) : obligatoire si retenue', t: 'select', o: () => [['', '— Aucun —'], ...D.fournisseurs.slice().sort((a, b) => a.nom.localeCompare(b.nom)).map(f => [f.id, f.nom])], d: ''}, {k: 'tauxRS', l: 'Retenue à la source (%) : 10 pour un loyer, 0 sinon', t: 'number', d: 0}, DOSF],

    if (v.retenue > 0 && !v.fournId) { toast('Choisissez le tiers (bailleur) pour la retenue : il doit exister dans Fournisseurs avec son matricule fiscal ou sa CIN.', true); return false; }

    await setOrUpd('depenses', id, v); toast('Dépense enregistrée' + (v.retenue > 0 ? ' : net payé ' + fmt(v.montant - v.retenue) + ', retenue ' + fmt(v.retenue) : '')); }};
document.addEventListener('change', e => { const t = e.target; if (t.id !== 'f-categorie') return; const fm = t.closest('form'); if (!fm || fm.dataset.pf !== 'depense') return; const r = fm.elements.tauxRS; if (r && t.value === 'Loyer' && !(+r.value > 0)) r.value = 10; });

/* ---------- Factures fournisseurs et règlements ---------- */
PF.facf = {n: 'Facture fournisseur', e: 'Modifier la facture fournisseur', f: [{k: 'fournId', l: 'Fournisseur', t: 'select', req: 1, o: () => [['', '— Choisir —'], ...D.fournisseurs.slice().sort((a, b) => a.nom.localeCompare(b.nom)).map(f => [f.id, f.nom])], d: '', w: 1}, {k: 'numero', l: 'N° de la facture', req: 1}, {k: 'date', l: 'Date de la facture', t: 'date', d: () => ds()}, {k: 'moisBR', l: 'Mois des livraisons (bons de réception)', t: 'month', d: () => ffMoisDef(ds())}, {k: 'ht19', l: 'Montant HT soumis à TVA 19 % (DT)', t: 'number', d: 0}, {k: 'ht7', l: 'Montant HT soumis à TVA 7 % (DT)', t: 'number', d: 0}, {k: 'ht13', l: 'Montant HT soumis à TVA 13 % (DT)', t: 'number', d: 0}, {k: 'ht0', l: 'Montant HT exonéré / 0 % (DT)', t: 'number', d: 0}, {k: 'tva', l: 'TVA totale (DT) : vide = calculée', t: 'number', d: ''}, {k: 'timbre', l: 'Timbre (DT)', t: 'number', d: 1}, {k: 'ttc', l: 'Total TTC (DT) — vide = calculé', t: 'number', d: ''}, ACTFF, {k: 'echeance', l: 'Échéance (date de facture + délai du fournisseur)', t: 'date', d: ''}, {k: 'brs', l: 'Bons de réception concernés (remplis automatiquement, modifiables)', w: 1}, DOSF],
  save: async (v, id) => { if (!v.fournId || !v.numero) { toast('Fournisseur et numéro obligatoires.', true); return false; } const f = byId(D.fournisseurs, v.fournId) || {}; const V = [[19, v.ht19], [7, v.ht7], [13, v.ht13], [0, v.ht0]].map(([rate, h]) => ({rate, ht: r3(+h || 0), tva: r3((+h || 0) * rate / 100)})).filter(x => x.ht > 0); ['ht19', 'ht7', 'ht13', 'ht0'].forEach(k => { v[k] = r3(+v[k] || 0); });
    v.ventil = V; v.ht = r3(V.reduce((s, x) => s + x.ht, 0)); v.tva = +v.tva > 0 ? r3(+v.tva) : r3(V.reduce((s, x) => s + x.tva, 0)); v.timbre = r3(+v.timbre || 0); v.ttc = r3(+v.ttc || (v.ht + v.tva + v.timbre)); if (!(v.ttc > 0)) { toast('Montant manquant.', true); return false; }
    if (!v.echeance) { const d = new Date(v.date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + (+f.delai || 30)); v.echeance = d.toISOString().slice(0, 10); } v.fournisseur = f.nom || ''; await setOrUpd('facfourn', id, v, {statut: 'Enregistrée'}); toast('Facture fournisseur enregistrée'); }};
PF.reglf = {n: 'Règlement fournisseur', ok: 'Enregistrer', f: [{k: 'montant', l: 'Montant payé (DT)', t: 'number', req: 1, d: x => x ? x.reste : 0}, {k: 'date', l: 'Date', t: 'date', d: () => ds()}, {k: 'mode', l: 'Mode', t: 'select', o: MODEP, d: 'Chèque'}, {k: 'ref', l: 'N° chèque / virement'}],
  save: async (v, id, x) => { const m = r3(+v.montant); if (!(m > 0)) { toast('Montant invalide.', true); return false; } if (m > x.reste + 0.0005) { toast('Supérieur au reste à payer (' + fmt(x.reste) + ').', true); return false; } await ctx.db.doc('reglfourn/' + uid()).set({factureId: x.id, numero: x.numero, fournisseur: x.fournisseur, montant: m, date: v.date, mode: v.mode, ref: v.ref, ...stamp()}); toast('Règlement enregistré'); }};
function vFacf() {
  const f = FILT.ffs || 'apayer', today = ds(), all = D.facfourn.filter(x => x.statut !== 'Annulée'), L = all.filter(x => f === 'toutes' || (f === 'apayer' ? ffReste(x) > 0 : f === 'retard' ? ffReste(x) > 0 && x.echeance < today : ffReste(x) === 0)).sort((a, b) => (a.echeance || '').localeCompare(b.echeance || ''));
  const dette = sumBy(all, ffReste), ret = sumBy(all.filter(x => x.echeance < today), ffReste), sem = sumBy(all.filter(x => x.echeance >= today && x.echeance <= dAdd(today, 7)), ffReste);
  const rows = L.map(x => { const r = ffReste(x), late = r > 0 && x.echeance < today, P = D.reglfourn.filter(p => p.factureId === x.id);
    return `<tr class="fi"><td class="font-semibold">${esc(x.fournisseur)}<div class="text-xs text-mute">Facture ${esc(x.numero)} du ${fdate(x.date)}${x.brs ? ' · ' + esc(x.brs) : ''}</div>${dosTag(x.dossier)}</td><td>${fdate(x.echeance)}${late ? ' ' + bd('En retard', 'b-bad') : ''}</td><td class="num">${fmt(x.ttc)}</td><td class="num">${fmt(ffPaid(x))}${P.length ? `<div class="text-xs text-mute">${P.map(p => fdate(p.date) + ' ' + esc(p.mode) + (p.mode === 'Traite' ? ` <button type="button" style="text-decoration:underline;background:none;border:0;padding:0;color:inherit;cursor:pointer;font:inherit" data-a="trprint" data-id="${p.id}">traite ${p.echeance ? 'au ' + fdate(p.echeance) : ''}</button>` : '')).join(', ')}</div>` : ''}</td><td class="num">${r > 0 ? '<b>' + fmt(r) + '</b>' : bd('Payée', 'b-ok')}</td><td><div class="acts">${r > 0 ? smb('ffpay', 'Payer', 'btn-p', 'data-id="' + x.id + '"') : ''}${smb('ffedit', 'Modifier', 'btn-o', 'data-id="' + x.id + '"')}${smb('avfnew', 'Avoir', 'btn-o', 'data-id="' + x.id + '"')}</div></td></tr>`; }).join('') || emptyRow(6, 'Aucune facture.');

}

/* ---------- Journal de caisse ---------- */
const CTYP = {'Solde initial': 1, 'Retrait banque': 1, 'Apport associé': 1, 'Autre entrée': 1, 'Versement banque': -1, 'Retrait du gérant': -1, 'Avance sur salaire du gérant': -1, 'Avance employé': -1, 'Autre sortie': -1, 'Écart de caisse (+)': 1, 'Écart de caisse (−)': -1};
const CTYPF = Object.keys(CTYP).filter(k => !/^Écart/.test(k));
PF.caisse = {n: 'Opération de caisse', ok: 'Enregistrer', f: [{k: 'type', l: 'Opération', t: 'select', o: CTYPF, d: 'Versement banque'}, {k: 'date', l: 'Date', t: 'date', d: () => ds()}, {k: 'montant', l: 'Montant (DT)', t: 'number', req: 1, d: 0}, {k: 'ref', l: 'Référence (n° bordereau de versement…)'}, {...CPTF, l: 'Compte bancaire (versement ou retrait banque)'}, {k: 'benef', l: 'Employé (avance employé)'}, {k: 'note', l: 'Remarque', w: 1}],
  save: async v => { const m = r3(+v.montant); if (!(m > 0)) { toast('Montant invalide.', true); return false; } if (cashLocked(v.date)) { toast('La caisse du ' + fdate(v.date) + ' est clôturée : choisissez une date postérieure.', true); return false; } if (v.type === 'Versement banque' && !v.ref) toast('Pensez à noter le n° du bordereau de versement.'); await ctx.db.doc('caisse/' + uid()).set({...v, montant: m, ...stamp()}); toast('Opération enregistrée'); }};
function caisseLines() {
  const L = [];
  D.paiements.filter(p => p.mode === 'Espèces').forEach(p => L.push({date: p.date, lib: 'Encaissement ' + (p.numero || ''), m: +p.montant, src: 'Client'}));
  D.recus.filter(r => r.mode === 'Espèces' && !/^Annul/.test(r.statut || '')).forEach(r => L.push({date: r.date, lib: 'Reçu technicien ' + r.numero + ' · ' + ((r.client || {}).nom || ''), m: +r.montant, src: 'Reçu'}));
  D.depenses.filter(x => x.mode === 'Espèces' && depOk(x)).forEach(x => L.push({date: x.date, lib: x.categorie + ' · ' + x.libelle, m: -r3(x.montant - (+x.retenue || 0)), src: 'Dépense'}));
  D.reglfourn.filter(x => x.mode === 'Espèces').forEach(x => L.push({date: x.date, lib: 'Règlement ' + x.fournisseur + ' · ' + x.numero, m: -x.montant, src: 'Fournisseur'}));
  D.remboursements.filter(x => x.mode === 'Espèces').forEach(x => L.push({date: x.date, lib: 'Remboursement ' + x.client + ' · avoir ' + x.avoir, m: -x.montant, src: 'Avoir'}));
  D.caisse.forEach(x => L.push({date: x.date, lib: x.type + (x.ref ? ' · ' + x.ref : '') + (x.note ? ' · ' + x.note : ''), m: CTYP[x.type] * x.montant, src: 'Caisse', id: x.id}));
  const pr = x => /^Solde initial/.test(x.lib) ? 0 : 1;

function vCaisse() {
  const ym = FILT.cam || ds().slice(0, 7), A = caisseLines(), avant = sumBy(A.filter(x => x.date < ym + '-01'), x => x.m), M = A.filter(x => inMonth(x.date, ym));
  let s = avant; const rows = M.map(x => { s = r3(s + x.m); return `<tr><td>${fdate(x.date)}</td><td>${esc(x.lib)}<div class="text-xs text-mute">${esc(x.src)}</div></td><td class="num">${x.m > 0 ? fmt(x.m) : ''}</td><td class="num">${x.m < 0 ? fmt(-x.m) : ''}</td><td class="num"><b>${fmt(s)}</b></td><td>${x.id ? `<button type="button" class="ib" data-a="cadel" data-id="${x.id}" aria-label="Supprimer">${ic('trash')}</button>` : ''}</td></tr>`; }).join('') || emptyRow(6, 'Aucun mouvement de caisse ce mois.');
  const ent = sumBy(M.filter(x => x.m > 0), x => x.m), sor = sumBy(M.filter(x => x.m < 0), x => -x.m), vers = sumBy(D.caisse.filter(x => x.type === 'Versement banque' && inMonth(x.date, ym)), x => x.montant);

    `<div class="grid gap-3" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:1rem">${kpi('Solde début de mois', fmt(avant), '', 'euro')}${kpi('Entrées', fmt(ent), '', 'chart', 't-ok')}${kpi('Sorties', fmt(sor), 'dont versements banque ' + fmt(vers), 'chart')}${kpi('Solde théorique', fmt(r3(avant + ent - sor)), 'à comparer au comptage réel', 'check', r3(avant + ent - sor) < 0 ? 't-bad' : 't-ok')}${kpi('Retraits du gérant', fmt(sumBy(D.caisse.filter(x => ['Retrait du gérant', 'Avance sur salaire du gérant'].includes(x.type) && inMonth(x.date, ym)), x => x.montant)), 'dont avances à déduire du salaire : ' + fmt(sumBy(D.caisse.filter(x => x.type === 'Avance sur salaire du gérant' && inMonth(x.date, ym)), x => x.montant)), 'users')}</div>` + clotureHtml(ym) +
    tbl('<th>Date</th><th>Opération</th><th class="num">Entrée</th><th class="num">Sortie</th><th class="num">Solde</th><th></th>', rows, 760) +
    '<p class="hint">Commencez par une opération « Solde initial » avec l\'argent présent en caisse le jour du démarrage. Chaque versement en banque doit porter le n° du bordereau : c\'est la preuve pour votre comptable.</p>';

/* ================= Étape 6 : commandes clients, bons de livraison, facturation de BL ================= */
const lkey = l => l.aid || ('t:' + normS(l.desig || ''));
const blActive = () => D.livraisons.filter(b => b.statut !== 'Annulé');
async function createBL(client, lignes, extra = {}) {
  lignes = frz(lignes);
  const dup = await already('livraisons', extra.opId); if (dup) return dup;
  return withLock(async () => {
    const a = await alloc('bl', ['BL'], 'BL', 'livraisons');
    const doc = {type: 'BL', numero: a.numero, seq: a.seq, annee: a.y, date: ds(), client, lignes, totals: calc(lignes, 'DV'), statut: 'À facturer', by: ctx.uid || '', at: new Date().toISOString(), ...extra};
    await ctx.db.doc('livraisons/' + a.id).set(doc); await a.cref.set({last: a.seq});
    const conf = await applyStock(lignes, a.numero, -1);
    return {id: a.id, numero: a.numero, doc, conf};
  });
}
async function updateBL(b, client, lignes, motif, x = {}) {
  lignes = frz(lignes);
  return withLock(async () => {
    const ref = ctx.db.doc('livraisons/' + b.id), s = await ref.get(); if (!s.exists) throw new Error('BL introuvable.');
    const cur = s.data(); if (cur.statut !== 'À facturer') throw new Error('Ce BL est déjà facturé ou annulé : passez par un avoir.');
    await applyStock(cur.lignes, cur.numero, +1); const conf = await applyStock(lignes, cur.numero, -1);
    await ref.update({client: {...cur.client, ...client}, lignes, totals: calc(lignes, 'DV'), ...x, modifs: [...(cur.modifs || []), {at: new Date().toISOString(), by: ctx.uid || '', motif, avant: {lignes: cur.lignes}}]});
    return {conf};
  });
}
async function cancelBL(b) {
  return withLock(async () => {
    const ref = ctx.db.doc('livraisons/' + b.id), cur = (await ref.get()).data(); if (cur.statut !== 'À facturer') throw new Error('Seul un BL non facturé peut être annulé.');
    await applyStock(cur.lignes, cur.numero, +1); await ref.update({statut: 'Annulé', annuleLe: new Date().toISOString(), annulePar: ctx.uid || ''});
  });
}
async function createCC(client, lignes, extra = {}) {
  const dup = await already('cmdclients', extra.opId); if (dup) return dup;
  return withLock(async () => {
    const a = await alloc('cc', ['CC'], 'CC', 'cmdclients');
    const doc = {type: 'CC', numero: a.numero, seq: a.seq, annee: a.y, date: ds(), client, lignes, totals: calc(lignes, 'DV'), statut: 'En cours', by: ctx.uid || '', at: new Date().toISOString(), ...extra};
    await ctx.db.doc('cmdclients/' + a.id).set(doc); await a.cref.set({last: a.seq});
    return {id: a.id, numero: a.numero, doc};
  });
}
/* quantités livrées par ligne de commande (déduites des BL non annulés liés) */
function ccLivre(c) { const m = {}; blActive().filter(b => b.cmdId === c.id).forEach(b => b.lignes.forEach(l => { const k = lkey(l); m[k] = r3((m[k] || 0) + (+l.qte || 0)); })); return m; }
function ccReste(c) { const m = ccLivre(c), left = {...m}; return c.lignes.map(l => { const k = lkey(l), dl = Math.min(+l.qte, left[k] || 0); left[k] = r3((left[k] || 0) - dl); return {...l, livre: dl, reste: r3(+l.qte - dl)}; }); }
function ccStatut(c) { if (c.statut === 'Annulée') return 'Annulée'; const R = ccReste(c), tot = R.reduce((s, l) => s + l.qte, 0), liv = R.reduce((s, l) => s + l.livre, 0); return liv <= 0 ? 'En cours' : liv >= tot - 0.0005 ? 'Livrée' : 'Livrée partiellement'; }

async function saveBLCC(L, client) {
  if (!needOn()) return;
  try {
    BUSY = true;
    if (ED.kind === 'CC') {
      const r = await createCC(client, L, {opId: uid() + uid(), dossier: ED.dossier || '', activite: edAct(), ...(ED.from && ED.from.devisId ? {devisId: ED.from.devisId, devisNumero: ED.from.devisNumero || ''} : {})});
      if (ED.from && ED.from.devisId) await ctx.db.doc('devis/' + ED.from.devisId).update({statut: 'Accepté', commandeClient: r.numero});
      ensureClient(client); BUSY = false; closeModal(); showDoc({...r.doc, id: r.id}); toast('Commande client ' + r.numero + ' enregistrée'); return;
    }
    if (ED.edit) {
      const motif = (ED.motif || '').trim(); if (!motif) { BUSY = false; return toast('Indiquez le motif (retour, erreur de quantité…).', true); }
      const r = await updateBL(ED.edit, {nom: client.nom.trim(), mf: client.mf || '', adresse: client.adresse || ''}, L, motif, {vehicule: ED.vehicule || '', chauffeur: ED.chauffeur || '', regId: ED.regId || ''}); BUSY = false; closeModal(); render(); toast('BL modifié, stock ajusté' + (r.conf.length ? ' (conflit de stock signalé)' : '')); return;
    }
    const cc = ED.from && ED.from.ccId ? byId(D.cmdclients, ED.from.ccId) : null;
    const r = await createBL(client, L, {opId: uid() + uid(), dossier: ED.dossier || '', activite: edAct(), vehicule: ED.vehicule || '', chauffeur: ED.chauffeur || '', regId: ED.regId || '', ...(cc ? {cmdId: cc.id, cmdNumero: cc.numero} : {})});
    ensureClient(client); BUSY = false; closeModal(); showDoc({...r.doc, id: r.id}); toast('BL ' + r.numero + ' créé, stock diminué' + (r.conf && r.conf.length ? ' (stock insuffisant signalé)' : ''));
  } catch (e) { BUSY = false; toast(e.message || 'Enregistrement impossible', true); }
}

/* Facturation d'un ou plusieurs BL (même client) : la facture ne retouche pas le stock */
const BLSEL = new Set();
function mergeLines(bls) {
  const m = new Map();
  bls.forEach(b => b.lignes.forEach(l => { const k = lkey(l) + '|' + l.pu + '|' + (+l.rem || 0) + '|' + l.tva; const e = m.get(k), q = +l.qte || 0, pr = l.pr != null ? +l.pr : null; if (e) { if (pr != null && e.pr != null && e.qte + q > 0) e.pr = Math.round((e.pr * e.qte + pr * q) / (e.qte + q) * 1000) / 1000; e.qte = r3(e.qte + q); } else m.set(k, {aid: l.aid || null, desig: l.desig, qte: q, pu: +l.pu, tva: +l.tva, ...(+l.rem > 0 ? {rem: +l.rem} : {}), ...(pr != null ? {pr} : {})}); }));
  return [...m.values()].filter(l => l.qte > 0);
}
async function invoiceBLs(type) {
  if (BUSY || !needOn()) return;
  const bls = [...BLSEL].map(id => byId(D.livraisons, id)).filter(b => b && b.statut === 'À facturer');
  if (!bls.length) return toast('Cochez au moins un BL à facturer.', true);
  if (new Set(bls.map(b => normS(b.client.nom))).size > 1) return toast('Les BL cochés doivent être du même client.', true);
  const doss = [...new Set(bls.map(b => b.dossier || ''))], L = mergeLines(bls);
  if (!L.length) return toast('Ces BL ne contiennent plus aucune quantité.', true);
  try {
    BUSY = true;
    const r = await createFacture(type, bls[0].client, L, {source: 'bl', noStock: true, blIds: bls.map(b => b.id), blNums: bls.map(b => b.numero), dossier: doss.length === 1 ? doss[0] : '', opId: uid() + uid()});
    for (const b of bls) await ctx.db.doc('livraisons/' + b.id).update({statut: 'Facturé', factureNumero: r.numero, factureId: r.id});
    BLSEL.clear(); BUSY = false; render(); showDoc({...r.doc, id: r.id}); toast('Facture ' + r.numero + ' créée à partir de ' + bls.length + ' BL');
  } catch (e) { BUSY = false; toast(e.message || 'Facturation impossible', true); }
}

const BLB = {'À facturer': 'b-warn', 'Facturé': 'b-ok', 'Annulé': 'b-mute'}, CCB = {'En cours': 'b-info', 'Livrée partiellement': 'b-warn', 'Livrée': 'b-ok', 'Annulée': 'b-mute'};

document.addEventListener('click', e => {

/* CSV : encodage UTF-8 ou Windows-1252 (Excel français), séparateur ; ou , détecté */
function csvBook(buf) {
  let txt = new TextDecoder('utf-8').decode(new Uint8Array(buf)); if (txt.includes(String.fromCharCode(0xFFFD))) txt = new TextDecoder('windows-1252').decode(new Uint8Array(buf));
  txt = txt.replace(/^﻿/, ''); const first = txt.split(/\r?\n/)[0] || '', FS = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  return XLSX.read(txt, {type: 'string', FS, raw: true});
}

/* Transfert des données RH d'une fiche sans compte vers le compte qui lui est rattaché */
async function migrateKey(from, to) {
  if (!from || !to || from === to) return;
  for (const c of ['rh', 'pointages', 'demandes']) {
    const fr = ctx.db.doc(c + '/' + from), fs = await fr.get(); if (!fs.exists) continue;
    const tr = ctx.db.doc(c + '/' + to), ts = await tr.get(), a = fs.data(), b = ts.exists ? ts.data() : {};
    const m = c === 'pointages' ? {days: {...(a.days || {}), ...(b.days || {})}} : c === 'demandes' ? {items: [...(a.items || []), ...(b.items || [])]} : {...a, ...b, decisions: {...(a.decisions || {}), ...(b.decisions || {})}};
    await tr.set(m); await fr.delete();
  }
  for (const iv of D.interventions.filter(x => (x.techIds || []).includes(from))) await ctx.db.doc('interventions/' + iv.id).update({techIds: iv.techIds.map(t => t === from ? to : t)});
}
async function linkAccount(u, target, role) {
  let p = target === 'new' ? null : byId(D.personnel, target);
  if (!p) { const id = uid() + uid(); p = {id, nom: nameOf(u), poste: '', role, embauche: ds(), statut: 'Actif'}; await ctx.db.doc('personnel/' + id).set({...p, uid: u, ...stamp()}); }
  else { if (p.uid && p.uid !== u) throw new Error('Cette fiche est déjà rattachée à un autre compte.'); await migrateKey(p.id, u); await ctx.db.doc('personnel/' + p.id).update({uid: u}); }
  await ctx.db.doc('staff/' + u).set({role: p.role || role, pid: p.id}); await ctx.db.doc('requests/' + u).delete();
}

/* ================= Réapprovisionnement : articles sous le seuil et bons de commande automatiques ================= */
const OPENBC = ['Brouillon', 'Envoyée', 'Reçue partiellement'];
const sous = a => (+a.stock || 0) <= (+a.seuil || 0) && !((+a.seuil || 0) === 0 && (+a.stock || 0) > 0);
function enCommande(aid) { /* quantités encore attendues sur les commandes fournisseurs ouvertes */
  let q = 0; const nums = [];
  D.commandes.filter(c => c.categorie === 'Fournisseur' && OPENBC.includes(c.statut)).forEach(c => c.lignes.forEach(l => { if (l.aid === aid) { const r = r3(l.qte - (l.recu || 0)); if (r > 0) { q += r; nums.push(c.numero); } } }));
  return {q: r3(q), nums: [...new Set(nums)]};
}
const qteReassort = a => { const st = +a.stock || 0, cible = +a.stockMax > 0 ? +a.stockMax : +a.seuil || 0; return Math.max(1, r3(cible - st)); };
let RAPRUN = false;
async function autoReappro(manual) {
  if (RAPRUN || OFF || !ctx.db || !['admin', 'commercial'].includes(myRole())) return; RAPRUN = true; let added = 0;
  try {
    /* fin d'épisode : un article repassé au-dessus du seuil pourra de nouveau être commandé automatiquement */
    for (const a of D.articles.filter(a => a.enReappro && !sous(a))) await ctx.db.doc('articles/' + a.id).update({enReappro: false});
    /* brouillons automatiques : la quantité suit le stock pour atteindre la cible, sauf si vous l'avez modifiée à la main */
    for (const c of D.commandes.filter(c => c.statut === 'Brouillon' && (c.auto || c.lignes.some(l => l.autoQ != null)))) {
      let ch = false; const L = c.lignes.map(l => { const a = l.aid && byId(D.articles, l.aid); if (!a || !(l.autoQ != null || c.auto) || (l.autoQ != null && l.qte !== l.autoQ)) return l; const q = qteReassort(a); if (q === l.qte && l.autoQ === q) return l; ch = true; return {...l, qte: q, autoQ: q}; });
      if (ch) await ctx.db.doc('commandes/' + c.id).update({lignes: L, totals: calc(L, 'FT')});
    }
    const cands = D.articles.filter(a => a.reappro !== 'Non' && sous(a) && !a.enReappro && a.fournId && byId(D.fournisseurs, a.fournId) && enCommande(a.id).q <= 0);
    if (!cands.length) { if (manual) toast('Rien à ajouter : les articles suivis sont déjà en commande ou au-dessus du seuil.'); return; }
    await withLock(async () => {
      const groups = {}; cands.forEach(a => (groups[a.fournId] = groups[a.fournId] || []).push(a));
      for (const fid of Object.keys(groups)) {
        const f = byId(D.fournisseurs, fid), lines = groups[fid].map(a => ({aid: a.id, desig: a.nom, qte: qteReassort(a), autoQ: qteReassort(a), pu: +a.paDernier || +a.pa || 0, tva: a.tva}));
        const ex = brouillonDe(f.nom, '');
        if (ex) { const L = mergeCmdLines(ex.lignes, lines); await ctx.db.doc('commandes/' + ex.id).update({lignes: L, totals: calc(L, 'FT')}); }
        else { const b = await alloc('bc', ['BC'], 'BC', 'commandes'); await ctx.db.doc('commandes/' + b.id).set({type: 'BC', numero: b.numero, seq: b.seq, annee: b.y, date: ds(), statut: 'Brouillon', auto: true, categorie: 'Fournisseur', fournisseur: {nom: f.nom, mf: f.mf || '', adresse: f.adresse || ''}, dossier: '', prevue: '', note: '', lignes: lines, totals: calc(lines, 'FT'), ...stamp()}); await b.cref.set({last: b.seq}); }
        for (const a of groups[fid]) await ctx.db.doc('articles/' + a.id).update({enReappro: true});
        added += lines.length;
      }
    });
    toast(added + ' article(s) sous le seuil ajouté(s) aux bons de commande brouillon, à vérifier avant envoi');
  } catch (e) { if (manual) toast(e.message || 'Réapprovisionnement impossible', true); } finally { RAPRUN = false; }
}
setInterval(() => { if (D.articles && D.articles.length) autoReappro(false); }, 30000);

function vReappro() {
  const tous = !!FILT.rapTous, q = normS(FILT.rapq || '');
  const L = D.articles.filter(a => (tous || a.reappro !== 'Non') && sous(a) && (!q || normS((a.ref || '') + ' ' + a.nom).includes(q))).sort((a, b) => ((+a.stock || 0) - (+a.seuil || 0)) - ((+b.stock || 0) - (+b.seuil || 0)));
  const rows = L.map(a => { const ec = enCommande(a.id), f = a.fournId ? byId(D.fournisseurs, a.fournId) : null;
    const etat = ec.q > 0 ? bd('En commande : ' + ec.q, 'b-info') + `<div class="text-xs text-mute">${ec.nums.map(esc).join(', ')}</div>` : a.reappro === 'Non' ? bd('Non suivi', 'b-mute') : !f ? bd('Fournisseur principal manquant', 'b-bad') : bd('À commander', 'b-warn');
    return `<tr class="fi"><td class="font-semibold">${esc(a.ref || '')}</td><td>${esc(a.nom)}</td><td class="num" style="color:${(+a.stock || 0) <= 0 ? 'var(--bad-fg,#b91c1c)' : 'inherit'}"><b>${+a.stock || 0}</b></td><td class="num">${+a.seuil || 0}</td><td class="num">${qteReassort(a)}</td><td>${f ? esc(f.nom) : '—'}</td><td>${etat}</td><td><label class="chk"><input type="checkbox" data-rapsuivi="${a.id}"${a.reappro !== 'Non' ? ' checked' : ''}>Suivi</label></td></tr>`; }).join('') || emptyRow(8, tous ? 'Aucun article sous le stock minimal.' : 'Aucun article suivi sous le stock minimal.');
  const nRupt = D.articles.filter(a => (+a.stock || 0) <= 0).length;
  return head('Réapprovisionnement', 'Articles à zéro ou sous le stock minimal. Les articles suivis sont ajoutés automatiquement à un bon de commande brouillon chez leur fournisseur principal ; vous le vérifiez, modifiez ou supprimez avant de l\'envoyer.',
    `<input class="in" style="width:12rem" placeholder="Code ou désignation…" data-a="filt" data-f="rapq" value="${esc(FILT.rapq || '')}"><label class="chk"><input type="checkbox" data-raptous${tous ? ' checked' : ''}>Afficher aussi les articles non suivis</label>` + btn('rapgo', 'Ajouter maintenant aux bons de commande', 'btn-p', '', 'truck')) +
    `<div class="grid gap-3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:1rem">${kpi('Sous le stock minimal', L.length, tous ? 'tous articles' : 'articles suivis', 'box', L.length ? 't-warn' : 't-ok')}${kpi('En rupture (stock 0)', nRupt, 'vente toujours possible', 'box', nRupt ? 't-bad' : 't-ok')}${kpi('Brouillons automatiques', D.commandes.filter(c => c.auto && c.statut === 'Brouillon').length, 'à vérifier et envoyer (Commandes)', 'truck')}</div>` +
    tbl('<th>Code</th><th>Désignation</th><th class="num">Stock</th><th class="num">Minimum</th><th class="num">À commander</th><th>Fournisseur principal</th><th>État</th><th></th>', rows, 900) +
    '<p class="hint">Pour régler un article : Articles & stock → Modifier → stock minimal, stock cible, fournisseur principal, réapprovisionnement automatique, vente sans stock. Un article retiré d\'un brouillon ne sera pas rajouté tant qu\'il n\'est pas repassé au-dessus de son stock minimal.</p>';
}
document.addEventListener('click', e => { const b = e.target.closest('[data-a="rapgo"]'); if (b) autoReappro(true); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.rapsuivi) wr(() => ctx.db.doc('articles/' + t.dataset.rapsuivi).update({reappro: t.checked ? 'Oui' : 'Non'}));

/* un seul bon de commande brouillon par fournisseur (et par dossier) : les nouveaux articles s'y ajoutent */
const brouillonDe = (nom, dossier) => D.commandes.filter(c => c.categorie === 'Fournisseur' && c.statut === 'Brouillon' && normS((c.fournisseur || {}).nom || '') === normS(nom || '') && (c.dossier || '') === (dossier || '')).sort((a, b) => (a.numero || '').localeCompare(b.numero || ''))[0] || null;
function mergeCmdLines(A, B) {
  const M = A.map(l => ({...l}));
  B.forEach(n => { const e = n.aid && M.find(l => l.aid === n.aid && (+l.pu || 0) === (+n.pu || 0) && !l.recu); if (e) { e.qte = r3((+e.qte || 0) + (+n.qte || 0)); if (e.autoQ != null || n.autoQ != null) e.autoQ = e.qte; } else M.push({...n}); });
  return M;
}

/* ================= Modalités de paiement et échéancier par tranches ================= */
const MCOND = ['Comptant', 'À 30 jours', 'À 60 jours', 'À 90 jours', 'Par tranches'], MMODE = ['Espèces', 'Chèque', 'Virement', 'Traite', 'Carte', 'Mixte'];
const addM = (d, n) => { const x = new Date(d + 'T12:00:00Z'), day = x.getUTCDate(); x.setUTCDate(1); x.setUTCMonth(x.getUTCMonth() + n); const last = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate(); x.setUTCDate(Math.min(day, last)); return x.toISOString().slice(0, 10); };
function buildTranches(total, n, first) { n = Math.max(2, Math.min(24, Math.round(+n || 2))); const base = Math.floor(total / n * 1000) / 1000, T = []; for (let i = 0; i < n; i++) T.push({date: addM(first || ds(), i), montant: i === n - 1 ? r3(total - base * (n - 1)) : base}); return T; }
function modOf(m, total, date) {
  const o = {mode: m.mode || 'Espèces', cond: m.cond || 'Comptant'}; let ech = date || ds();
  if (o.cond === 'Par tranches') { o.tranches = buildTranches(total, m.n, m.first || date || ds()); ech = o.tranches[0].date; }
  else { const j = parseInt(o.cond.replace(/\D/g, ''), 10); if (j) ech = dAdd(date || ds(), j); }
  return {modalite: o, echeance: ech};
}
/* prochaine échéance non couverte par les paiements déjà reçus */
function echOf(f, pay) { const T = f.modalite && f.modalite.tranches; if (!T || !T.length) return null; let cum = 0; for (const t of T) { cum = r3(cum + t.montant); if (cum > pay + 0.0005) return t.date; } return T[T.length - 1].date; }
function modHtml(d) {
  const m = d.modalite; if (!m) return '';
  let h = `<div class="note"><b>Modalités de paiement :</b> ${esc(m.cond)} · ${esc(m.mode)}${m.cond !== 'Par tranches' && d.echeance ? ' · échéance le ' + fdate(d.echeance) : ''}</div>`;
  if (false) h += `<table style="max-width:340px;margin-left:0"><thead><tr><th>Tranche</th><th>Échéance</th><th class="r">Montant</th></tr></thead><tbody>${m.tranches.map((t, i) => `<tr><td>${t.deja ? 'Déjà réglé' : (m.tranches[0].deja ? i : i + 1)}</td><td>${fdate(t.date)}</td><td class="r">${fmt(t.montant)}</td></tr>`).join('')}</tbody></table>`;
  return h;
}
/* champs dans l'éditeur de facture */

function modInner(m) {

    ${m.cond === 'Par tranches' ? `<div><label class="lb" for="ed-mn">Nombre de tranches</label><input id="ed-mn" class="in" type="number" min="2" max="24" data-edmod="n" value="${m.n}"></div><div><label class="lb" for="ed-mf">Première échéance (puis chaque mois)</label><input id="ed-mf" class="in" type="date" data-edmod="first" value="${m.first}"></div>` : ''}`;
}

/* ================= PDF prêt à imprimer, regroupement rapide, avoirs partiels, coût des devis ================= */
/* Le cadre des pages Claude interdit l'impression directe : on produit un PDF A4 à ouvrir puis imprimer */
const loadJs = src => new Promise((ok, ko) => { if (document.querySelector('script[src="' + src + '"]')) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Bibliothèque PDF non chargée (connexion ?)')); document.head.appendChild(s); });
/* Rend un bloc HTML en PDF A4 : retire les lignes vides de remplissage si la pièce dépasse une page,
   et coupe les pages entre deux lignes (jamais au milieu d'un texte). */
async function pdfFromBox(box, filename) {
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  document.body.appendChild(box);
  const A4H = Math.floor(box.offsetWidth * 297 / 210) - 2; let v;
  while (box.scrollHeight > A4H && (v = box.querySelector('tr.vide'))) v.remove();
  const top = box.getBoundingClientRect().top, cuts = [...box.querySelectorAll('tr, .paper > *, .bas, .sign, .note, .tt > div, .lft > *, p, h2, li')].map(e => e.getBoundingClientRect().bottom - top).filter(x => x > 0).sort((a, b) => a - b);
  const bh = box.offsetHeight, cv = await html2canvas(box, {scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false}); box.remove();
  const k = cv.height / bh, {jsPDF} = window.jspdf, pdf = new jsPDF({unit: 'mm', format: 'a4'}), W = 210, ph = Math.floor(cv.width * 297 / W), lim = cv.height - ph * 0.03;
  let y = 0, first = true;
  while (y < lim) {
    let end = Math.min(cv.height, y + ph);
    if (end < cv.height) { const c = cuts.map(x => Math.round(x * k)).filter(x => x > y + ph * 0.3 && x <= y + ph).pop(); if (c) end = c; }
    const h = end - y, c = document.createElement('canvas'); c.width = cv.width; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, h); g.drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
    if (!first) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, h * W / cv.width); first = false; y = end;
  }
  await ctx.dl.save({filename, data: new Uint8Array(pdf.output('arraybuffer'))});
}
async function pdfDoc(d) {
  if (!ctx.dl) return toast('Téléchargement indisponible dans cette vue.', true);
  if (BUSY) return; BUSY = true; toast('Préparation du PDF…');
  try {
    const box = document.createElement('div'); box.className = 'a4'; box.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111'; box.innerHTML = docPrint(d);
    await pdfFromBox(box, String(d.numero).replace(/[^A-Za-z0-9_-]/g, '-') + '.pdf'); BUSY = false;
  } catch (e) { BUSY = false; if (!e || e.code !== 'declined') toast(e.message || 'PDF impossible.', true); }
}

/* ================= Arrondir le total (le client paie un montant rond : 702,350 → 700,000) =================
   Ajoute une ligne « Remise d'arrondi » négative par taux de TVA, au prorata, pour que le total TTC tombe sur le montant voulu.
   La TVA baisse en proportion (remise correcte fiscalement). Limite réglable pour les non-administrateurs. */
const arrSig = L => JSON.stringify(L.filter(l => !l.arr).map(l => [l.aid || l.desig, +l.qte, +l.pu, +l.rem || 0, +l.tva]));

  const S = cfg(), pct = diff / t0.ttc * 100, max = +S.remArrMax || 0;
  if (max > 0 && pct > max + 1e-9 && !can('admin')) return {err: 'Remise de ' + pct.toFixed(2).replace('.', ',') + ' % : au-delà de la limite de ' + max + ' % autorisée (Paramétrage). Demandez à l\'administrateur.'};
  const by = t0.by.filter(b => b.base > 0), tot = by.reduce((s, b) => s + b.base + b.tva, 0); if (!by.length) return {err: 'Rien à remiser.'};
  const H = by.map(b => ({rate: b.rate, h: -Math.round(diff * (b.base + b.tva) / tot / (1 + b.rate / 100) * 1000)}));
  const mk = H => H.filter(x => x.h !== 0).map(x => ({id: uid(), aid: null, desig: 'Remise d\'arrondi', qte: 1, pu: x.h / 1000, tva: x.rate, arr: true}));

  for (const a of r) for (const b of (H.length > 1 ? r : [0])) { const T = H.map((x, i) => ({...x, h: x.h + (i === 0 ? a : i === 1 ? b : 0)})), d = dOf(T); if (d <= 0 && (bd === null || d > bd)) { bd = d; best = T; } if (d === 0) break; }

}

/* Pièces d'une période : tickets, factures (hors facture globale, déjà comptée par ses tickets) et avoirs (en négatif, à leur date) */
function jPieces(du, au) {
  const R = [], inP = d => d >= du && d <= au;
  D.tickets.filter(t => inP(t.date)).forEach(t => { const an = t.statut === 'Annulé'; R.push({k: 'tic', d: t, type: 'Ticket', date: t.date, at: t.at || '', num: t.numero, client: cname(t), ttc: an ? 0 : r3(+t.totals.ttc || 0), ht: an ? 0 : r3(+t.totals.ht || 0), annule: an, act: 'Comptoir', by: t.by}); });
  D.factures.filter(f => f.source !== 'globale' && inP(f.date)).forEach(f => R.push({k: 'fact', d: f, type: 'Facture ' + f.type, date: f.date, at: f.at || '', num: f.numero, client: cname(f), ttc: r3(+f.totals.net || +f.totals.ttc || 0), ht: r3(+f.totals.ht || 0), annule: false, act: actDoc(f), by: f.by}));
  D.avoirs.filter(a => inP(a.date)).forEach(a => { const f = a.factureId ? byId(D.factures, a.factureId) : null, v = r3(a.partiel ? +a.totals.ttc || 0 : (a.totals.net != null ? +a.totals.net : +a.totals.ttc || 0)); R.push({k: 'av', d: a, type: 'Avoir', date: a.date, at: a.at || '', num: a.numero, client: cname(a), ttc: -v, ht: -r3(+a.totals.ht || 0), annule: false, act: a.ticketNumero ? 'Comptoir' : f ? actDoc(f) : 'Comptoir', by: a.by}); });
  return R.sort((x, y) => (x.date + x.at).localeCompare(y.date + y.at) || (x.num || '').localeCompare(y.num || ''));
}
const jEnc = (du, au) => D.paiements.filter(p => !p.annule && p.date >= du && p.date <= au && !String(p.id || '').startsWith('tmp'));
function jSum(du, au) {

}

const MSTACK = [];
function pushModal(after) {
  const mb = $('#mb'), frag = document.createDocumentFragment(); while (mb.firstChild) frag.appendChild(mb.firstChild);
  MSTACK.push({t: $('#mt').textContent, frag, wide: $('#mdl').classList.contains('wide'), ED, PFX, PF_CUR, SHOWN, after});
}
function popModal() {
  const s = MSTACK.pop(), mb = $('#mb'); mb.innerHTML = ''; mb.appendChild(s.frag); $('#mt').textContent = s.t; $('#mdl').classList.toggle('wide', s.wide);
  ED = s.ED; PFX = s.PFX; PF_CUR = s.PF_CUR; SHOWN = s.SHOWN; $('#ov').hidden = false;
  if (s.after) setTimeout(s.after, 0);
}

function qaddDecorate() {
  const mb = $('#mb'); if (!mb || $('#ov').hidden) return; const role = myRole();
  QADD.forEach((r, i) => mb.querySelectorAll(r.sel).forEach(el => {
    if (el.dataset.qadd || el.disabled || !r.roles.includes(role)) return;
    /* pas de « + » dans le formulaire qui crée justement ce type de fiche */
    const fm = el.closest('form'); if (fm && ((r.what === 'client' && fm.dataset.form === 'client') || (r.what === 'dossier' && fm.dataset.form === 'dossier'))) return;
    const t = 'q' + uid(); el.dataset.qadd = t;
    const w = document.createElement('div'); w.style.cssText = 'display:flex;gap:.35rem;align-items:center'; el.parentNode.insertBefore(w, el); w.appendChild(el); el.style.flex = '1'; el.style.minWidth = '0';
    w.insertAdjacentHTML('beforeend', `<button type="button" class="btn btn-o btn-sm" data-a="qadd" data-r="${i}" data-t="${t}" title="Créer un ${r.what}" aria-label="Créer un ${r.what}">${ic('plus')}</button>`);
  }));
}
new MutationObserver(() => qaddDecorate()).observe(document.body, {childList: true, subtree: true});
function qaddPick(r, t, before) {
  let n = 0; const tick = () => {
    const x = r.list().find(y => !before.has(String(r.val(y)))), el = document.querySelector(`[data-qadd="${t}"]`);
    if (x && el) {
      const v = String(r.val(x));
      if (el.tagName === 'SELECT') { if (![...el.options].some(o => o.value === v)) el.insertAdjacentHTML('beforeend', `<option value="${esc(v)}">${esc(r.lab(x))}</option>`); el.value = v; }
      else el.value = v;
      el.dispatchEvent(new Event('input', {bubbles: true})); el.dispatchEvent(new Event('change', {bubbles: true}));
      toast('« ' + r.lab(x) + ' » créé et sélectionné'); return;
    }
    if (++n < 25) setTimeout(tick, 200);
  };
  tick();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a="qadd"]'); if (!b) return; e.preventDefault();
  const r = QADD[+b.dataset.r], t = b.dataset.t, before = new Set(r.list().map(y => String(r.val(y))));

});

/* ---------- Sauvegarde complète : exporter / restaurer (fichier .json) ---------- */
const BKCOLS = ['settings', 'counters', 'articles', 'fournisseurs', 'clients', 'prospects', 'dossiers', 'devis', 'factures', 'tickets', 'avoirs', 'recus', 'paiements', 'credits', 'remboursements', 'cmdclients', 'livraisons', 'regroupements', 'commandes', 'receptions', 'mouvements', 'sorties', 'inventaires', 'comptages', 'interventions', 'taches', 'problemes', 'besoins', 'journal', 'modeles', 'personnel', 'pointages', 'demandes', 'rh', 'rhformations', 'rhrecrut', 'depenses', 'facfourn', 'reglfourn', 'avoirsfourn', 'retoursfourn', 'caisse', 'clotures', 'contactsadm', 'historique', 'conflicts'];
const BKPARAM = ['settings', 'modeles', 'personnel', 'contactsadm'];
let BKFILE = null;
function vSauvegarde() {
  const last = LS.get('casa_lastbk', '');
  return head('Sauvegarde', 'Copie complète de toutes les données dans un fichier, à garder sur votre PC ou une clé USB.', '') +
    `<section class="card p-4" style="margin-top:1rem"><h2 class="sec" style="margin-top:0">Exporter</h2><p class="text-sm">Télécharge un fichier <b>.json</b> contenant toutes les fiches (${BKCOLS.length} catégories : articles, clients, factures, caisse, personnel…). À faire <b>chaque semaine</b>, et avant toute opération importante.</p>${last ? `<p class="text-sm text-mute">Dernière sauvegarde depuis cet appareil : ${fdate(last.slice(0, 10))} à ${last.slice(11, 16)}.</p>` : ''}${btn('bkexp', 'Télécharger la sauvegarde', 'btn-p', '', 'down')}</section>
    <section class="card p-4" style="margin-top:1rem"><h2 class="sec" style="margin-top:0">Restaurer</h2><p class="text-sm">Recharge un fichier de sauvegarde. Les fiches du fichier <b>remplacent</b> celles qui ont le même identifiant ; les autres fiches ne sont pas touchées.</p>
    <label class="lb" for="bk-file">Fichier de sauvegarde (.json)</label><input id="bk-file" type="file" accept=".json,application/json" class="in">
    <div id="bk-info" class="text-sm" style="margin-top:.5rem"></div>
    <div class="grid gap-1" style="margin-top:.5rem"><label class="chk"><input type="radio" name="bk-mode" value="param" checked> Paramètres seulement : société, logo, comptes, modèles, personnel, contacts</label><label class="chk"><input type="radio" name="bk-mode" value="tout"> Tout restaurer (toutes les fiches)</label></div>
    <div style="margin-top:.75rem">${btn('bkimp', 'Restaurer', 'btn-o', '', 'upload')}</div><div id="bk-prog" class="text-sm" style="margin-top:.5rem"></div></section>`;
}
document.addEventListener('change', e => {
  if (e.target.id !== 'bk-file') return; const f = e.target.files[0], info = $('#bk-info'); BKFILE = null; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); if (!j || !j.collections) throw 0; BKFILE = j; const n = Object.values(j.collections).reduce((s, o) => s + Object.keys(o).length, 0); info.innerHTML = `Sauvegarde du <b>${esc(String(j.date || '').slice(0, 16).replace('T', ' à '))}</b> · ${n} fiches · ${esc(j.source || '')}`; } catch (x) { info.innerHTML = '<span style="color:#b91c1c">Ce fichier n\'est pas une sauvegarde CASA-ELECT.</span>'; } };
  rd.readAsText(f);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a="bkexp"],[data-a="bkimp"]'); if (!b) return;
  if (b.dataset.a === 'bkexp') wr(async () => {
    if (!ctx.dl) return toast('Téléchargement indisponible dans cette vue.', true);
    toast('Préparation de la sauvegarde…'); const out = {app: 'CASA-ELECT', version: 1, date: new Date().toISOString(), source: window.CASA_SB ? 'Supabase' : 'version d\'essai', collections: {}};
    for (const c of BKCOLS) { try { const s = await ctx.db.collection(c).get(); if (s.docs.length) { out.collections[c] = {}; s.docs.forEach(d => { out.collections[c][d.id] = d.data(); }); } } catch (x) { /* catégorie non lisible pour ce compte */ } }
    const n = Object.values(out.collections).reduce((s, o) => s + Object.keys(o).length, 0);
    await ctx.dl.save({filename: 'sauvegarde-casa-elect-' + ds() + '.json', data: new TextEncoder().encode(JSON.stringify(out))});
    LS.set('casa_lastbk', new Date().toISOString()); toast('Sauvegarde téléchargée : ' + n + ' fiches'); render();
  });
  else {
    if (!BKFILE) return toast('Choisissez d\'abord un fichier de sauvegarde.', true);
    const mode = ($('input[name="bk-mode"]:checked') || {}).value || 'param';
    if (!arm(b, mode === 'tout' ? 'Tout remplacer ?' : 'Restaurer les paramètres ?')) return;
    wr(async () => {
      const cols = Object.keys(BKFILE.collections).filter(c => BKCOLS.includes(c) && (mode === 'tout' || BKPARAM.includes(c)));
      const jobs = []; cols.forEach(c => Object.entries(BKFILE.collections[c]).forEach(([id, d]) => jobs.push([c, id, d])));
      const pr = $('#bk-prog'); let k = 0, ko = 0;
      for (let i = 0; i < jobs.length; i += 8) {
        await Promise.all(jobs.slice(i, i + 8).map(([c, id, d]) => ctx.db.doc(c + '/' + id).set(d).then(() => { k++; }, () => { ko++; })));
        if (pr) pr.textContent = 'Restauration : ' + (k + ko) + ' / ' + jobs.length + (ko ? ' (' + ko + ' refusée(s))' : '');
      }
      toast('Restauration terminée : ' + k + ' fiche(s)' + (ko ? ', ' + ko + ' refusée(s)' : ''), !!ko); BKFILE = null;
    });
  }
});
